server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain
spring:
  application:
    name: api-tarefa
  datasource:
#    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tarefa_db}
#    driver-class-name: org.postgresql.Driver
#    username: ${DATABASE_USER_NAME:root}
#    password: ${DATABASE_USER_PASSWORD:root}
    url: jdbc:h2:mem:tarefa_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    h2:
      console:
        enabled: true
        path: /h2-console
  jpa:
#    database: POSTGRESQL
    database: H2
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      database-platform: org.hibernate.dialect.H2Dialect
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER